name: Build LoginDemo (Free, no signing)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: 构建 .app（模拟器，Debug）
        run: |
          xcodebuild \
            -project LoginDemo.xcodeproj \
            -scheme LoginDemo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: 整理 .app（保留 .app 目录外壳）
        run: |
          mkdir -p out-sim
          cp -R dd/Build/Products/Debug-iphonesimulator/LoginDemo.app out-sim/

      - name: 上传 .app（模拟器）
        uses: actions/upload-artifact@v4
        with:
          name: LoginDemo-App-Simulator
          path: "out-sim/LoginDemo.app"
          retention-days: 14
          if-no-files-found: error

      - name: 构建 .ipa（真机 arm64，未签名）
        run: |
          xcodebuild \
            -project LoginDemo.xcodeproj \
            -scheme LoginDemo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd-device \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p ipa/Payload
          cp -R dd-device/Build/Products/Release-iphoneos/LoginDemo.app ipa/Payload/
          cd ipa && zip -qry ../LoginDemo-unsigned.ipa Payload

      - name: 上传 .ipa（真机）
        uses: actions/upload-artifact@v4
        with:
          name: LoginDemo-IPA-Unsigned
          path: "LoginDemo-unsigned.ipa"
          retention-days: 14
          if-no-files-found: error
