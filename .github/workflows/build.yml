name: Build LoginDemo (Free, no signing)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: 构建 .app（无签名，Simulator）
        run: |
          xcodebuild \
            -project LoginDemo.xcodeproj \
            -scheme LoginDemo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LoginDemo-App
          path: "build/Products/Debug-iphonesimulator/LoginDemo.app"
          retention-days: 14
          if-no-files-found: error
